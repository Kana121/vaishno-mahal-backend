services:
  - type: web
    name: eazystore
    env: docker
    plan: free
    region: singapore  # Choose the region closest to your users
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/*.jar --spring.profiles.active=prod"
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: eazystore-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: eazystore-db
          property: username
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: eazystore-db
          property: password
      - key: RAZORPAY_KEY_ID
        sync: false  # You'll need to set this in Render dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false  # You'll need to set this in Render dashboard

databases:
  - name: eazystore-db
    databaseName: eazystore
    user: eazystore_user
    plan: free  # Free tier for development, upgrade for production
