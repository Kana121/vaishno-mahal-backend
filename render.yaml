services:
  - type: web
    name: eazystore
    env: docker
    plan: free
    region: singapore
    buildCommand: "mvn clean package -DskipTests"
    startCommand: "java -jar target/*.jar --spring.profiles.active=prod"
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: eazystore-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: eazystore-db
          property: username
      - key: DB_PASSWORD
        fromDatabase:
          name: eazystore-db
          property: password
      - key: RAZORPAY_KEY_ID
        sync: false  # You'll need to set this in Render dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false  # You'll need to set this in Render dashboard
      - key: JPA_SHOW_SQL
        value: "false"
      - key: HIBERNATE_FORMAT_SQL
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"

databases:
  - name: eazystore-db
    databaseName: eazystore
    plan: free  # Free tier for development, upgrade for production
